# Protocole vu par l'API : celui d'un reverse proxy HTTPS placé devant, sinon le nôtre.
map $http_x_forwarded_proto $fwd_proto {
  default $http_x_forwarded_proto;
  ""      $scheme;
}

server {
  listen 8080;
  server_name _;
  server_tokens off;

  # Les en-têtes de sécurité sont ajoutés par l'API (helmet) et par le
  # conteneur web ; ce proxy ne fait que les relayer.
  location /api/ {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    proxy_read_timeout 60s;
  }

  location / {
    proxy_pass http://web:8080;
    proxy_set_header Host $http_host;
  }
}
