apiVersion: apps/v1
kind: Deployment
metadata:
  name: asp-web
  namespace: asp-portal
  labels:
    app.kubernetes.io/name: asp-web
    app.kubernetes.io/part-of: asp-portal
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: asp-web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: asp-web
        app.kubernetes.io/part-of: asp-portal
    spec:
      containers:
        - name: web
          image: IMAGE_WEB
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: asp-web
  namespace: asp-portal
  labels:
    app.kubernetes.io/name: asp-web
    app.kubernetes.io/part-of: asp-portal
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: asp-web
  ports:
    - name: http
      port: 80
      targetPort: http