# =============================================================================
# Exposition publique via Traefik (inclus dans k3s) : HTTPS obligatoire.
# Middlewares : CRD traefik.io, référencés « <namespace>-<nom>@kubernetescrd ».
# DOMAIN_PLACEHOLDER est remplacé par deploy.sh.
# =============================================================================
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: asp-https-redirect
  namespace: asp-portal
  labels:
    app.kubernetes.io/part-of: asp-portal
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: asp-body-limit
  namespace: asp-portal
  labels:
    app.kubernetes.io/part-of: asp-portal
spec:
  buffering:
    maxRequestBodyBytes: 8388608
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: asp-portal
  namespace: asp-portal
  labels:
    app.kubernetes.io/part-of: asp-portal
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: asp-portal-asp-body-limit@kubernetescrd
    # Remplacé par deploy.sh (annotation cert-manager) ou retiré.
    # TLS_ISSUER_ANNOTATION
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - DOMAIN_PLACEHOLDER
      secretName: asp-portal-tls
  rules:
    - host: DOMAIN_PLACEHOLDER
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: asp-api
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: asp-web
                port:
                  number: 80
---
# HTTPS obligatoire : toute requête HTTP est redirigée (permanente) vers HTTPS.
# Le backend n'est jamais atteint ; le challenge HTTP-01 de cert-manager
# (chemin plus long, donc prioritaire) reste servi en HTTP.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: asp-portal-http-redirect
  namespace: asp-portal
  labels:
    app.kubernetes.io/part-of: asp-portal
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: asp-portal-asp-https-redirect@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: DOMAIN_PLACEHOLDER
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: asp-web
                port:
                  number: 80
