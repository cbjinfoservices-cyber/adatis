apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: asp-portal
  namespace: asp-portal
  labels:
    app.kubernetes.io/part-of: asp-portal
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "8m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - DOMAIN_PLACEHOLDER
      secretName: asp-portal-tls
  rules:
    - host: DOMAIN_PLACEHOLDER
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: asp-api
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: asp-web
                port:
                  number: 80