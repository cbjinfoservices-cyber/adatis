apiVersion: v1
kind: Namespace
metadata:
  name: asp-portal
  labels:
    app.kubernetes.io/part-of: asp-portal
    # Pod Security Standards « restricted » : tout pod root, privilégié, avec
    # capacités ou sans profil seccomp est refusé à l'admission.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
