apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: asp-portal
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: asp-portal
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
# Accès réseau : TLS obligatoire et mot de passe SCRAM. Toute connexion TCP
# en clair est refusée. Le socket Unix (interne au conteneur : sondes,
# administration par kubectl exec) reste en confiance locale.
apiVersion: v1
kind: ConfigMap
metadata:
  name: asp-pg-hba
  namespace: asp-portal
  labels:
    app.kubernetes.io/part-of: asp-portal
data:
  pg_hba.conf: |
    local    all  all                trust
    hostssl  all  all  0.0.0.0/0     scram-sha-256
    hostssl  all  all  ::/0          scram-sha-256
    host     all  all  0.0.0.0/0     reject
    host     all  all  ::/0          reject
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: asp-portal
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: asp-portal
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: asp-portal
    spec:
      automountServiceAccountToken: false
      # Image alpine : utilisateur postgres = UID 70.
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: IMAGE_POSTGRES
          imagePullPolicy: IfNotPresent
          args:
            - -c
            - ssl=on
            - -c
            - ssl_cert_file=/etc/postgresql/tls/tls.crt
            - -c
            - ssl_key_file=/etc/postgresql/tls/tls.key
            - -c
            - ssl_min_protocol_version=TLSv1.2
            - -c
            - hba_file=/etc/postgresql/hba/pg_hba.conf
            - -c
            - password_encryption=scram-sha-256
            - -c
            - log_connections=on
            - -c
            - log_disconnections=on
          ports:
            - name: postgres
              containerPort: 5432
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: asp-db
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: asp-db
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: asp-db
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: tls
              mountPath: /etc/postgresql/tls
              readOnly: true
            - name: hba
              mountPath: /etc/postgresql/hba
              readOnly: true
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
        # Certificat serveur signé par l'autorité interne (deploy.sh). La clé
        # appartient à root, lisible par le groupe postgres (0640 : accepté).
        - name: tls
          secret:
            secretName: asp-pg-tls
            defaultMode: 0640
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
        - name: hba
          configMap:
            name: asp-pg-hba
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: asp-portal
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: asp-portal
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
