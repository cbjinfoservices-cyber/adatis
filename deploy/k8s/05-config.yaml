apiVersion: v1
kind: ConfigMap
metadata:
  name: asp-config
  namespace: asp-portal
  labels:
    app.kubernetes.io/part-of: asp-portal
data:
  # Origines autorisées à appeler l'API (séparées par des virgules).
  # Remplacé automatiquement par deploy.sh si ALLOWED_ORIGINS est défini.
  ALLOWED_ORIGINS: "*"
  # URL de l'API consommée par le SPA (injectée au build, cf. deploy.sh).
  API_URL: "/api"
  # Destinataire des alertes de disponibilité (valeur par défaut, modifiable
  # depuis la page Système). Vide = aucune alerte email.
  ALERT_EMAIL_TO: ""
  # URL publique du portail, reprise dans le corps des emails d'alerte.
  PORTAL_URL: ""
  # --- Authentification SSO AWX ---------------------------------------------
  # disabled = portail ouvert (comportement historique).
  # awx = connexion OAuth2 obligatoire ; reste « disabled » tant que l'URL,
  # le client id et le client secret ne sont pas tous fournis.
  AUTH_MODE: "disabled"
  AWX_BASE_URL: ""
  AWX_CLIENT_ID: ""
  AWX_SCOPES: "read write"
  # Liste d'identifiants AWX promus administrateurs en plus des superusers.
  AWX_ADMIN_USERS: ""
  SESSION_TTL_HOURS: "12"