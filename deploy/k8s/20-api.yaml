apiVersion: apps/v1
kind: Deployment
metadata:
  name: asp-api
  namespace: asp-portal
  labels:
    app.kubernetes.io/name: asp-api
    app.kubernetes.io/part-of: asp-portal
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: asp-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: asp-api
        app.kubernetes.io/part-of: asp-portal
    spec:
      # L'API n'appelle jamais l'API Kubernetes : aucun jeton monté.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-postgres
          image: IMAGE_BUSYBOX
          command:
            - sh
            - -c
            - |
              until nc -z postgres 5432; do
                echo "attente de postgres…"; sleep 2;
              done
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
      containers:
        - name: api
          image: IMAGE_API
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: PORT
              value: "8080"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: asp-db
                  key: DATABASE_URL
            # Connexion PostgreSQL chiffrée, certificat vérifié contre l'autorité
            # interne générée par deploy.sh (secret asp-pg-tls).
            - name: PG_SSL
              value: "true"
            - name: PG_SSL_CA_FILE
              value: /etc/asp/pg-tls/ca.crt
            - name: ALLOWED_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: asp-config
                  key: ALLOWED_ORIGINS
            # "true" derrière l'Ingress HTTPS : cookie de session toujours Secure.
            - name: COOKIE_SECURE
              valueFrom:
                configMapKeyRef:
                  name: asp-config
                  key: COOKIE_SECURE
                  optional: true
            - name: PG_POOL_MAX
              value: "10"
            - name: PORTAL_URL
              valueFrom:
                configMapKeyRef:
                  name: asp-config
                  key: PORTAL_URL
                  optional: true
            - name: SESSION_IDLE_MINUTES
              valueFrom:
                configMapKeyRef:
                  name: asp-config
                  key: SESSION_IDLE_MINUTES
                  optional: true
            # Hôtes que le test de connecteur a le droit d'appeler (SSRF).
            - name: CONNECTOR_ALLOWED_HOSTS
              valueFrom:
                configMapKeyRef:
                  name: asp-config
                  key: CONNECTOR_ALLOWED_HOSTS
                  optional: true
            # --- Alertes email : SMTP interne (Resend seulement si accepté) ---
            - name: ALERT_EMAIL_TO
              valueFrom:
                configMapKeyRef:
                  name: asp-config
                  key: ALERT_EMAIL_TO
                  optional: true
            - name: ALERT_EMAIL_FROM
              valueFrom:
                configMapKeyRef:
                  name: asp-config
                  key: ALERT_EMAIL_FROM
                  optional: true
            - name: SMTP_HOST
              valueFrom:
                configMapKeyRef:
                  name: asp-config
                  key: SMTP_HOST
                  optional: true
            - name: SMTP_PORT
              valueFrom:
                configMapKeyRef:
                  name: asp-config
                  key: SMTP_PORT
                  optional: true
            - name: SMTP_SECURE
              valueFrom:
                configMapKeyRef:
                  name: asp-config
                  key: SMTP_SECURE
                  optional: true
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: asp-mail
                  key: SMTP_USER
                  optional: true
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: asp-mail
                  key: SMTP_PASSWORD
                  optional: true
            - name: ALLOW_EXTERNAL_MAIL
              valueFrom:
                configMapKeyRef:
                  name: asp-config
                  key: ALLOW_EXTERNAL_MAIL
                  optional: true
            - name: RESEND_API_KEY
              valueFrom:
                secretKeyRef:
                  name: asp-mail
                  key: RESEND_API_KEY
                  optional: true
            # --- Authentification SSO Ascender ---------------------------------
            - name: AUTH_MODE
              valueFrom:
                configMapKeyRef:
                  name: asp-config
                  key: AUTH_MODE
            - name: AWX_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: asp-config
                  key: AWX_BASE_URL
            - name: AWX_CLIENT_ID
              valueFrom:
                configMapKeyRef:
                  name: asp-config
                  key: AWX_CLIENT_ID
            - name: AWX_SCOPES
              valueFrom:
                configMapKeyRef:
                  name: asp-config
                  key: AWX_SCOPES
                  optional: true
            - name: AWX_ADMIN_USERS
              valueFrom:
                configMapKeyRef:
                  name: asp-config
                  key: AWX_ADMIN_USERS
                  optional: true
            - name: SESSION_TTL_HOURS
              valueFrom:
                configMapKeyRef:
                  name: asp-config
                  key: SESSION_TTL_HOURS
                  optional: true
            - name: AWX_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: asp-auth
                  key: AWX_CLIENT_SECRET
            - name: AWX_REDIRECT_URI
              valueFrom:
                secretKeyRef:
                  name: asp-auth
                  key: AWX_REDIRECT_URI
                  optional: true
            - name: TOKEN_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: asp-auth
                  key: TOKEN_ENCRYPTION_KEY
            # Anciennes clés, lues seulement pendant une rotation (deploy/README.md).
            - name: TOKEN_ENCRYPTION_KEYS_PREVIOUS
              valueFrom:
                secretKeyRef:
                  name: asp-auth
                  key: TOKEN_ENCRYPTION_KEYS_PREVIOUS
                  optional: true
            # Autorité interne qui signe le certificat d'Ascender (ConfigMap
            # optionnelle asp-ascender-ca, créée par deploy.sh avec ASCENDER_CA_FILE).
            - name: NODE_EXTRA_CA_CERTS
              value: /etc/asp/ascender-ca/ca.crt
          volumeMounts:
            - name: ascender-ca
              mountPath: /etc/asp/ascender-ca
              readOnly: true
            - name: pg-tls
              mountPath: /etc/asp/pg-tls
              readOnly: true
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: ascender-ca
          configMap:
            name: asp-ascender-ca
            optional: true
        - name: pg-tls
          secret:
            secretName: asp-pg-tls
            items:
              - key: ca.crt
                path: ca.crt
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: asp-api
  namespace: asp-portal
  labels:
    app.kubernetes.io/name: asp-api
    app.kubernetes.io/part-of: asp-portal
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: asp-api
  ports:
    - name: http
      port: 80
      targetPort: http
---
# Au moins une instance de l'API reste disponible pendant une maintenance de nœud.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: asp-api
  namespace: asp-portal
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: asp-api
