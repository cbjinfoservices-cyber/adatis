apiVersion: apps/v1
kind: Deployment
metadata:
  name: asp-api
  namespace: asp-portal
  labels:
    app.kubernetes.io/name: asp-api
    app.kubernetes.io/part-of: asp-portal
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: asp-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: asp-api
        app.kubernetes.io/part-of: asp-portal
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgres 5432; do
                echo "attente de postgres…"; sleep 2;
              done
      containers:
        - name: api
          image: IMAGE_API
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: asp-db
                  key: DATABASE_URL
            - name: ALLOWED_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: asp-config
                  key: ALLOWED_ORIGINS
            # "true" derrière l'Ingress HTTPS : cookie de session toujours Secure.
            - name: COOKIE_SECURE
              valueFrom:
                configMapKeyRef:
                  name: asp-config
                  key: COOKIE_SECURE
                  optional: true
            - name: PG_POOL_MAX
              value: "10"
            - name: ALERT_EMAIL_TO
              valueFrom:
                configMapKeyRef:
                  name: asp-config
                  key: ALERT_EMAIL_TO
                  optional: true
            - name: PORTAL_URL
              valueFrom:
                configMapKeyRef:
                  name: asp-config
                  key: PORTAL_URL
                  optional: true
            # Clé Resend et adresse d'expédition : secret optionnel, créé par
            # deploy.sh uniquement si RESEND_API_KEY est fourni.
            - name: RESEND_API_KEY
              valueFrom:
                secretKeyRef:
                  name: asp-alerts
                  key: RESEND_API_KEY
                  optional: true
            - name: ALERT_EMAIL_FROM
              valueFrom:
                secretKeyRef:
                  name: asp-alerts
                  key: ALERT_EMAIL_FROM
                  optional: true
            # --- Authentification SSO AWX -------------------------------------
            - name: AUTH_MODE
              valueFrom:
                configMapKeyRef:
                  name: asp-config
                  key: AUTH_MODE
                  optional: true
            - name: AWX_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: asp-config
                  key: AWX_BASE_URL
                  optional: true
            - name: AWX_CLIENT_ID
              valueFrom:
                configMapKeyRef:
                  name: asp-config
                  key: AWX_CLIENT_ID
                  optional: true
            - name: AWX_SCOPES
              valueFrom:
                configMapKeyRef:
                  name: asp-config
                  key: AWX_SCOPES
                  optional: true
            - name: AWX_ADMIN_USERS
              valueFrom:
                configMapKeyRef:
                  name: asp-config
                  key: AWX_ADMIN_USERS
                  optional: true
            - name: SESSION_TTL_HOURS
              valueFrom:
                configMapKeyRef:
                  name: asp-config
                  key: SESSION_TTL_HOURS
                  optional: true
            # Secret optionnel créé par deploy.sh quand AWX_CLIENT_SECRET est fourni.
            - name: AWX_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: asp-auth
                  key: AWX_CLIENT_SECRET
                  optional: true
            - name: AWX_REDIRECT_URI
              valueFrom:
                secretKeyRef:
                  name: asp-auth
                  key: AWX_REDIRECT_URI
                  optional: true
            - name: TOKEN_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: asp-auth
                  key: TOKEN_ENCRYPTION_KEY
                  optional: true
            # Autorité interne qui signe le certificat d'Ascender (ConfigMap
            # optionnelle asp-ascender-ca, créée par deploy.sh avec ASCENDER_CA_FILE).
            - name: NODE_EXTRA_CA_CERTS
              value: /etc/asp/ascender-ca/ca.crt
          volumeMounts:
            - name: ascender-ca
              mountPath: /etc/asp/ascender-ca
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: ascender-ca
          configMap:
            name: asp-ascender-ca
            optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: asp-api
  namespace: asp-portal
  labels:
    app.kubernetes.io/name: asp-api
    app.kubernetes.io/part-of: asp-portal
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: asp-api
  ports:
    - name: http
      port: 80
      targetPort: http