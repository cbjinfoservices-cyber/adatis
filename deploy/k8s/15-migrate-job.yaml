apiVersion: batch/v1
kind: Job
metadata:
  name: asp-db-migrate
  namespace: asp-portal
  labels:
    app.kubernetes.io/name: asp-db-migrate
    app.kubernetes.io/part-of: asp-portal
spec:
  backoffLimit: 4
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: asp-db-migrate
        app.kubernetes.io/part-of: asp-portal
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgres 5432; do
                echo "attente de postgres…"; sleep 2;
              done
      containers:
        - name: migrate
          image: postgres:16-alpine
          command: ["/bin/sh", "/sql/migrate.sh"]
          env:
            - name: PGHOST
              value: postgres
            - name: PGPORT
              value: "5432"
            - name: PGDATABASE
              valueFrom:
                secretKeyRef:
                  name: asp-db
                  key: POSTGRES_DB
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: asp-db
                  key: POSTGRES_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: asp-db
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: sql
              mountPath: /sql
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: sql
          configMap:
            name: asp-db-init
            defaultMode: 0755