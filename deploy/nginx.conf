server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Version de nginx jamais divulguée ; seules les méthodes de lecture servent
  # des fichiers statiques.
  server_tokens off;
  if ($request_method !~ ^(GET|HEAD)$) { return 405; }

  # Compression des assets statiques
  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff2;
  gzip_min_length 1024;

  # En-têtes de sécurité. Attention : nginx n'hérite pas des add_header du
  # serveur dans une location qui en déclare ; chaque location les reprend.
  #
  # CSP : tout est servi par le portail (polices et icônes comprises), l'API
  # est sur la même origine. 'unsafe-inline' n'est accordé qu'aux styles
  # (attributs style de React, palette appliquée en direct).
  set $csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'";

  add_header Content-Security-Policy $csp always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Resource-Policy "same-origin" always;

  # Cache long pour les fichiers versionnés par Vite
  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    try_files $uri =404;
  }

  # Repli SPA : toutes les routes React sont servies par index.html, jamais
  # mis en cache (une mise à jour de sécurité est prise au prochain chargement).
  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /index.html {
    add_header Cache-Control "no-store";
    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
  }

  location = /healthz {
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }
}
